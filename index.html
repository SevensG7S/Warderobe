<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гардероб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet: var(--tg-button-color, #6C4CFF);
    --violet-soft: var(--tg-secondary-bg-color, #EDE9FE);
    --pink: var(--tg-button-color, #FF5D8F);
    --pink-soft: var(--tg-secondary-bg-color, #FFE3ED);
    --teal: var(--tg-button-color, #0FBF9F);
    --teal-soft: var(--tg-secondary-bg-color, #DEFBF3);
    --amber: var(--tg-button-color, #FFA43D);
    --amber-soft: var(--tg-secondary-bg-color, #FFF0DC);
    --ink: var(--tg-button-text-color, #15131F);
    --ink-soft: var(--tg-hint-color, #635F76);
    --ink-faint: var(--tg-hint-color, #9A96AC);
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.86);
    --line: rgba(21,19,31,.09);
    --danger: var(--tg-button-color, #FF4B5C);
    --shadow: 0 16px 40px rgba(60,40,110,.14);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#121212;
    color:#fff;
    font-family:'Inter',system-ui,sans-serif;
}
  .app-container{
    position:relative;
    width:100%;
    max-width:480px;
    height:var(--tg-viewport-height, 100dvh);
    overflow:hidden;
    background:#F7F5FB;
    box-shadow:0 0 40px rgba(0,0,0,.4);
  }
  .mesh{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:rgba(247,245,251,0.15);
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(8deg);}
  }

  .app{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1;}
  .screen{flex:1; overflow-y:auto; padding:24px 20px 118px; scrollbar-width:none; display:none;}
  .screen.active{display:block;}
  .screen::-webkit-scrollbar{display:none;}

  .eyebrow{
    font-family:'Space Mono'; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 6px;
  }
  h1.title{
    font-family:'Space Grotesk'; font-weight:700; font-size:34px; line-height:1.02;
    margin:0; color:var(--ink); letter-spacing:-.01em;
  }
  .grad-word{
    background:linear-gradient(90deg,#6C4CFF,#FF5D8F);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat-row{
    margin-top:10px; display:flex; align-items:center; gap:8px;
    font-family:'Space Mono'; font-size:12px; color:var(--ink-soft);
  }
  .stat-row .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);}

  .glass-card{
    background:var(--glass); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.7); border-radius:26px; box-shadow:var(--shadow);
  }

  .cta-add{
    margin-top:22px; width:100%; border:none; cursor:pointer; text-align:left;
    padding:20px 20px; border-radius:26px; position:relative; overflow:hidden;
    background:linear-gradient(120deg,var(--violet),#8A6BFF 55%, var(--pink));
    color:#fff; display:flex; align-items:center; gap:14px;
    box-shadow:0 18px 30px rgba(108,76,255,.35);
  }
  .cta-add:active{transform:scale(.98);}
  .plus-badge{
    flex:none; width:46px;height:46px;border-radius:16px; background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;
  }
  .cta-add .txt b{display:block; font-family:'Space Grotesk'; font-weight:700; font-size:16.5px;}
  .cta-add .txt span{display:block; font-size:12px; opacity:.85; margin-top:2px;}

  .bento{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  .bento-card{
    padding:18px 16px; cursor:pointer; display:flex; flex-direction:column; gap:24px; min-height:118px;
  }
  .bento-card .icon-badge{
    width:40px;height:40px;border-radius:13px; display:flex;align-items:center;justify-content:center;
  }
  .bento-card b{font-family:'Space Grotesk'; font-size:15.5px; color:var(--ink); font-weight:600;}
  .bento-card span{font-family:'Space Mono'; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

  .section{margin-top:26px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .section-head h2{
    font-family:'Space Grotesk'; font-size:14px; letter-spacing:.02em; color:var(--ink); margin:0; font-weight:600;
  }
  .link-btn{
    font-family:'Space Mono'; font-size:11px; color:var(--violet); background:none; border:none; cursor:pointer;
    letter-spacing:.04em;
  }
  .strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .strip::-webkit-scrollbar{display:none;}

  .item-card{
    flex:none; width:92px; height:112px; border-radius:20px; position:relative; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s var(--ease);
  }
  .item-card:active{transform:scale(.94);}
  .icon-circle{
    width:48px;height:48px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .icon-circle svg{width:26px;height:26px;}
  .icon-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .item-card .name{
    font-size:10.5px; color:var(--ink-soft); font-weight:600; text-align:center;
    max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .item-card .del{
    position:absolute; top:6px; right:6px; width:18px;height:18px;border-radius:50%;
    background:var(--danger); color:#fff; font-size:11px; line-height:18px; text-align:center; font-weight:700; z-index:2;
  }

  .empty-hint{
    font-size:12.5px; color:var(--ink-soft); padding:18px; text-align:center; border-radius:20px;
    border:1.5px dashed rgba(21,19,31,.16);
  }

  .page-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .pill-btn{
    display:flex; align-items:center; gap:6px; border:none; cursor:pointer;
    font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; color:#fff;
    background:linear-gradient(120deg,var(--violet),var(--pink));
    padding:10px 15px; border-radius:999px; box-shadow:0 10px 18px rgba(108,76,255,.3);
  }
  .pill-btn:active{transform:scale(.95);}
  .filter-row{display:flex; gap:8px; overflow-x:auto; margin:16px 0 18px; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex:none; font-family:'Space Mono'; font-size:11.5px; padding:9px 15px; border-radius:999px;
    background:var(--glass-strong); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;
  }
  .filter-chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .items-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .items-grid .item-card{width:100%;}

  .looks-grid{display:flex; flex-direction:column; gap:14px; margin-top:16px;}
  .look-card{
    position:relative; padding:16px; display:flex; gap:14px; align-items:center; cursor:pointer;
  }
  .look-card::before{
    content:''; position:absolute; top:-7px; left:26px; width:14px; height:14px; border-radius:50%;
    background:#F7F5FB; border:2px solid rgba(21,19,31,.2);
  }
  .look-collage{
    flex:none; width:78px; height:78px; border-radius:16px; overflow:hidden;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px;
  }
  .look-collage .slot{display:flex;align-items:center;justify-content:center;}
  .look-collage .slot svg{width:22px;height:22px;}
  .look-collage .slot img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .look-info{flex:1;min-width:0;}
  .look-info .name{font-family:'Space Grotesk'; font-weight:700; font-size:16.5px; color:var(--ink); margin:0 0 4px;}
  .look-info .meta{font-family:'Space Mono'; font-size:10px; color:var(--ink-soft); letter-spacing:.03em; text-transform:uppercase;}
  .chev{margin-left:auto; opacity:.4; flex:none;}

  .tabbar{
    position:absolute; left:16px; right:16px; bottom:20px; height:68px; z-index:30;
    border-radius:24px; background:rgba(21,19,31,.88); backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:space-around; padding:0 6px;
    box-shadow:0 18px 30px rgba(0,0,0,.35);
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:none; border:none; cursor:pointer; width:74px; height:52px; border-radius:16px;
    color:rgba(255,255,255,.5); font-family:'Space Mono'; font-size:9px;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .tab svg{width:20px;height:20px;}
  .tab.active{
    color:#fff; background:linear-gradient(120deg,var(--violet),var(--pink));
  }

  .overlay{
    position:absolute; inset:0; background:rgba(15,12,22,.5); opacity:0; pointer-events:none;
    transition:opacity .25s var(--ease); z-index:60;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:70;
    background:#F7F5FB; border-radius:28px 28px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.3);
    transform:translateY(105%); transition:transform .32s var(--ease);
    max-height:92%; display:flex; flex-direction:column;
  }
  .sheet.show{transform:translateY(0);}
  .sheet .grabber{width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px;}
  .sheet-inner{padding:12px 20px 30px; overflow-y:auto;}
  .sheet h3{
    font-family:'Space Grotesk'; font-size:21px; font-weight:700; margin:6px 0 16px; color:var(--ink);
  }
  .field-label{
    font-family:'Space Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--ink-soft); margin:14px 0 7px;
  }
  .text-input{
    width:100%; border:1px solid var(--line); background:#fff; border-radius:14px;
    padding:13px 15px; font-family:'Inter'; font-size:15px; color:var(--ink); outline:none;
  }
  .text-input:focus{outline:2px solid var(--violet); outline-offset:1px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:'Space Mono'; font-size:11.5px; letter-spacing:.03em; padding:9px 14px;
    border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .upload-box{
    margin-top:6px; border:1.5px dashed rgba(21,19,31,.2); border-radius:16px; padding:20px;
    display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer; background:#fff;
    position:relative;
  }
  .upload-box img{width:64px;height:64px;object-fit:cover;border-radius:12px;}
  .upload-box .hint{font-size:12px;color:var(--ink-soft);}
  .upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .pick-groups{display:flex; flex-direction:column; gap:16px; margin-top:6px;}
  .pick-group-title{font-family:'Space Mono'; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  .pick-strip{display:flex; gap:9px; overflow-x:auto; margin-top:8px;}
  .pick-item{
    flex:none; width:68px; height:82px; border-radius:16px; background:#fff;
    border:1.5px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; cursor:pointer;
  }
  .pick-item .icon-circle{width:34px;height:34px;}
  .pick-item .icon-circle svg{width:18px;height:18px;}
  .pick-item.selected{border-color:var(--violet); background:var(--violet-soft);}
  .pick-item .n{font-size:8.5px;color:var(--ink-soft);text-align:center;padding:0 3px;}

  .primary-btn{
    width:100%; margin-top:22px; border:none; border-radius:16px; padding:15px;
    background:linear-gradient(120deg,var(--violet),var(--pink)); color:#fff;
    font-family:'Space Grotesk'; font-weight:700; font-size:14.5px; cursor:pointer;
    box-shadow:0 14px 24px rgba(108,76,255,.32);
  }
  .primary-btn:active{transform:scale(.98);}
  .secondary-btn{
    width:100%; margin-top:9px; border:1px solid var(--line); border-radius:16px; padding:13px;
    background:transparent; color:var(--ink-soft); font-family:'Inter'; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .edit-btn{
    width:100%; margin-top:14px; border:none; border-radius:16px; padding:14px;
    background:var(--violet-soft); color:var(--violet); font-family:'Space Grotesk'; font-weight:700; font-size:14px; cursor:pointer;
  }
  .edit-btn:active{transform:scale(.98);}
  .danger-btn{
    width:100%; margin-top:9px; border:1px solid rgba(255,75,92,.3); border-radius:16px; padding:13px;
    background:rgba(255,75,92,.08); color:var(--danger); font-family:'Inter'; font-weight:700; font-size:13.5px; cursor:pointer;
  }

  .look-canvas {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 14px;
    margin-bottom: 24px;
  }
  .look-canvas-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .look-canvas-title {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding-left: 4px;
  }
  .big-cloth-card {
    position: relative;
    background: #fff;
    border-radius: 24px;
    border: 1px solid var(--line);
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
  }
  .big-cloth-card.empty {
    border: 1.5px dashed rgba(21,19,31,.15);
    background: #f4f4f4;
    height: 90px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s var(--ease);
  }
  .big-cloth-card.empty:active {
    background: #eaeaea;
  }
  .big-cloth-card.empty span {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .big-cloth-img {
    width: 100%;
    height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-color: #f4f4f4;
  }
  .big-cloth-img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .big-cloth-img svg {
    width: 80px;
    height: 80px;
  }
  .big-cloth-footer {
    padding: 12px 18px;
    border-top: 1px solid rgba(21,19,31,.05);
    background: #ffffff;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .big-cloth-footer b {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    color: var(--ink);
  }
  .big-cloth-footer span {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .remove-from-look {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(21,19,31,.7);
    backdrop-filter: blur(8px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    z-index: 10;
    transition: transform .15s var(--ease), background .15s var(--ease);
  }
  .remove-from-look:active {
    transform: scale(0.9);
    background: var(--danger);
  }

  .profile-view{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:26px;}
  .profile-view .avatar{
    width:80px;height:80px;border-radius:26px; background:linear-gradient(135deg,var(--violet),var(--pink));
    display:flex; align-items:center;justify-content:center; margin-bottom:16px;
  }
  .profile-view h2{font-family:'Space Grotesk'; font-size:21px; margin:0 0 6px; font-weight:700;}
  .profile-view p{font-size:12.5px;color:var(--ink-soft);max-width:250px;margin:0;}
  .profile-stats{display:flex;gap:14px;margin-top:24px; width:100%;}
  .profile-stats .glass-card{flex:1; padding:16px 8px; text-align:center;}
  .profile-stats b{display:block;font-family:'Space Grotesk';font-size:22px;}
  .profile-stats span{font-family:'Space Mono';font-size:9px;color:var(--ink-soft);text-transform:uppercase;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="mesh"></div>

  <div class="app">

    <!-- HOME -->
    <div class="screen active" id="screenHome">
      <p class="eyebrow" id="dateLine">Вторник, 25 августа</p>
      <h1 class="title" id="greeting">Доброе <span class="grad-word">утро</span></h1>
      <div class="stat-row">
        <span id="itemCount">0 вещей</span><span class="dot"></span><span id="lookCount">0 луков</span>
      </div>

      <button class="cta-add" id="homeAddBtn">
        <span class="plus-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        </span>
        <span class="txt"><b>Добавить вещь</b><span>Новое фото в гардероб</span></span>
      </button>

      <div class="bento">
        <div class="bento-card glass-card" data-goto="items">
          <span class="icon-badge" style="background:var(--violet-soft);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 3h1.4c.6 2 2 2 3.2 0H15l1 5-2.2 1.2c.4 2.6-.2 4.4-1.8 5.8-1.6-1.4-2.2-3.2-1.8-5.8L8 8l1-5z" stroke="var(--violet)" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 3L6 9M15 3l3 6" stroke="var(--violet)" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <div>
            <b>Все вещи</b><br><span id="bentoItemsCount">0 предметов</span>
          </div>
        </div>
        <div class="bento-card glass-card" data-goto="looks">
          <span class="icon-badge" style="background:var(--pink-soft);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 5.6L20 10l-4.5 3.6L16.8 20 12 16.6 7.2 20l1.3-6.4L4 10l5.8-1.4L12 3z" stroke="var(--pink)" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </span>
          <div>
            <b>Мои луки</b><br><span id="bentoLooksCount">0 образов</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Недавно добавлено</h2>
          <button class="link-btn" data-goto="items">все вещи →</button>
        </div>
        <div class="strip" id="recentStrip"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Твои луки</h2>
          <button class="link-btn" data-goto="looks">смотреть все →</button>
        </div>
        <div id="recentLooks"></div>
      </div>
    </div>

    <!-- ITEMS -->
    <div class="screen" id="screenItems">
      <div class="page-head">
        <div>
          <p class="eyebrow">Гардероб</p>
          <h1 class="title" style="font-size:26px;">Все вещи</h1>
        </div>
        <button class="pill-btn" id="itemsAddBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
          Добавить
        </button>
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" data-filter="all">Все</button>
        <button class="filter-chip" data-filter="headwear">Головной убор</button>
        <button class="filter-chip" data-filter="tops">Верх</button>
        <button class="filter-chip" data-filter="bottoms">Низ</button>
        <button class="filter-chip" data-filter="shoes">Обувь</button>
      </div>
      <div class="items-grid" id="itemsGrid"></div>
    </div>

    <!-- LOOKS -->
    <div class="screen" id="screenLooks">
      <div class="page-head">
        <div>
          <p class="eyebrow">Образы</p>
          <h1 class="title" style="font-size:26px;">Твои луки</h1>
        </div>
        <button class="pill-btn" id="looksAddBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
          Папка
        </button>
      </div>
      <button class="link-btn" id="rollBtnLooks" style="margin-top:10px;">🎲 собрать случайный лук</button>
      <div class="looks-grid" id="looksGrid"></div>
    </div>

    <!-- PROFILE -->
    <div class="screen" id="screenProfile">
      <div class="profile-view">
        <div class="avatar">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#fff" stroke-width="1.6"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h2>Твой профиль</h2>
        <p>Статистика гардероба и любимые сочетания собираются здесь автоматически.</p>
        <div class="profile-stats">
          <div class="glass-card"><b id="pStat1">0</b><span>Вещей</span></div>
          <div class="glass-card"><b id="pStat2">0</b><span>Луков</span></div>
          <div class="glass-card"><b>4</b><span>Категории</span></div>
        </div>
        <!-- BACKUP SECTION -->
        <div class="section" style="margin-top:26px;">
          <div class="section-head">
            <h2>Резервное копирование</h2>
          </div>
          <div class="glass-card" style="padding:16px; text-align:center;">
            <button class="primary-btn" id="exportBackupBtn">Экспорт резервной копии</button>
            <button class="secondary-btn" id="importBackupBtn" style="margin-top:12px; display:block; width:100%;">Импорт резервной копии</button>
            <input type="file" id="backupFileInput" accept=".json" style="display:none;">
          </div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Главная
      </button>
      <button class="tab" data-tab="items">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 3h1.4c.6 2 2 2 3.2 0H15l1 5-2.2 1.2c.4 2.6-.2 4.4-1.8 5.8-1.6-1.4-2.2-3.2-1.8-5.8L8 8l1-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 3L6 9M15 3l3 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Вещи
      </button>
      <button class="tab" data-tab="looks">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 5.6L20 10l-4.5 3.6L16.8 20 12 16.6 7.2 20l1.3-6.4L4 10l5.8-1.4L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Луки
      </button>
      <button class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.3-3.6 3.9-5.4 7-5.4S17.7 16.4 19 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Профиль
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div class="sheet-inner" id="sheetInner"></div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
