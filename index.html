<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Гардероб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6C4CFF;
    --violet-soft:#EDE9FE;
    --pink:#FF5D8F;
    --pink-soft:#FFE3ED;
    --teal:#0FBF9F;
    --teal-soft:#DEFBF3;
    --amber:#FFA43D;
    --amber-soft:#FFF0DC;
    --ink:#15131F;
    --ink-soft:#635F76;
    --ink-faint:#9A96AC;
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.86);
    --line: rgba(21,19,31,.09);
    --danger:#FF4B5C;
    --shadow: 0 16px 40px rgba(60,40,110,.14);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#0E0B14;
    background-image:
      radial-gradient(50% 40% at 15% 15%, rgba(108,76,255,.35), transparent),
      radial-gradient(45% 35% at 85% 20%, rgba(255,93,143,.25), transparent),
      radial-gradient(40% 40% at 50% 90%, rgba(15,191,159,.22), transparent);
    font-family:'Inter',system-ui,sans-serif;
  }
  .app-container{
    position:relative;
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#F7F5FB;
    box-shadow:0 0 40px rgba(0,0,0,.4);
  }
  .mesh{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(55% 32% at 10% 8%, var(--violet-soft), transparent 60%),
      radial-gradient(50% 30% at 95% 18%, var(--pink-soft), transparent 60%),
      radial-gradient(55% 34% at 20% 95%, var(--teal-soft), transparent 60%),
      radial-gradient(45% 30% at 90% 85%, var(--amber-soft), transparent 60%),
      #F7F5FB;
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(8deg);}
  }

  .app{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1;}
  .screen{flex:1; overflow-y:auto; padding:24px 20px 118px; scrollbar-width:none; display:none;}
  .screen.active{display:block;}
  .screen::-webkit-scrollbar{display:none;}

  .eyebrow{
    font-family:'Space Mono'; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 6px;
  }
  h1.title{
    font-family:'Space Grotesk'; font-weight:700; font-size:34px; line-height:1.02;
    margin:0; color:var(--ink); letter-spacing:-.01em;
  }
  .grad-word{
    background:linear-gradient(90deg,var(--violet),var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stat-row{
    margin-top:10px; display:flex; align-items:center; gap:8px;
    font-family:'Space Mono'; font-size:12px; color:var(--ink-soft);
  }
  .stat-row .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);}

  .glass-card{
    background:var(--glass); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.7); border-radius:26px; box-shadow:var(--shadow);
  }

  .cta-add{
    margin-top:22px; width:100%; border:none; cursor:pointer; text-align:left;
    padding:20px 20px; border-radius:26px; position:relative; overflow:hidden;
    background:linear-gradient(120deg,var(--violet),#8A6BFF 55%, var(--pink));
    color:#fff; display:flex; align-items:center; gap:14px;
    box-shadow:0 18px 30px rgba(108,76,255,.35);
  }
  .cta-add:active{transform:scale(.98);}
  .cta-add .plus-badge{
    flex:none; width:46px;height:46px;border-radius:16px; background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;
  }
  .cta-add .txt b{display:block; font-family:'Space Grotesk'; font-weight:700; font-size:16.5px;}
  .cta-add .txt span{display:block; font-size:12px; opacity:.85; margin-top:2px;}

  .bento{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  .bento-card{
    padding:18px 16px; cursor:pointer; display:flex; flex-direction:column; gap:24px; min-height:118px;
  }
  .bento-card .icon-badge{
    width:40px;height:40px;border-radius:13px; display:flex;align-items:center;justify-content:center;
  }
  .bento-card b{font-family:'Space Grotesk'; font-size:15.5px; color:var(--ink); font-weight:600;}
  .bento-card span{font-family:'Space Mono'; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

  .section{margin-top:26px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .section-head h2{
    font-family:'Space Grotesk'; font-size:14px; letter-spacing:.02em; color:var(--ink); margin:0; font-weight:600;
  }
  .link-btn{
    font-family:'Space Mono'; font-size:11px; color:var(--violet); background:none; border:none; cursor:pointer;
    letter-spacing:.04em;
  }
  .strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .strip::-webkit-scrollbar{display:none;}

  .item-card{
    flex:none; width:92px; height:112px; border-radius:20px; position:relative; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s var(--ease);
  }
  .item-card:active{transform:scale(.94);}
  .icon-circle{
    width:48px;height:48px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .icon-circle svg{width:26px;height:26px;}
  .icon-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .item-card .name{
    font-size:10.5px; color:var(--ink-soft); font-weight:600; text-align:center;
    max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .item-card .del{
    position:absolute; top:6px; right:6px; width:18px;height:18px;border-radius:50%;
    background:var(--danger); color:#fff; font-size:11px; line-height:18px; text-align:center; font-weight:700; z-index:2;
  }

  .empty-hint{
    font-size:12.5px; color:var(--ink-soft); padding:18px; text-align:center; border-radius:20px;
    border:1.5px dashed rgba(21,19,31,.16);
  }

  .page-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .pill-btn{
    display:flex; align-items:center; gap:6px; border:none; cursor:pointer;
    font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; color:#fff;
    background:linear-gradient(120deg,var(--violet),var(--pink));
    padding:10px 15px; border-radius:999px; box-shadow:0 10px 18px rgba(108,76,255,.3);
  }
  .pill-btn:active{transform:scale(.95);}
  .filter-row{display:flex; gap:8px; overflow-x:auto; margin:16px 0 18px; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex:none; font-family:'Space Mono'; font-size:11.5px; padding:9px 15px; border-radius:999px;
    background:var(--glass-strong); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;
  }
  .filter-chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .items-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .items-grid .item-card{width:100%;}

  .looks-grid{display:flex; flex-direction:column; gap:14px; margin-top:16px;}
  .look-card{
    position:relative; padding:16px; display:flex; gap:14px; align-items:center; cursor:pointer;
  }
  .look-card::before{
    content:''; position:absolute; top:-7px; left:26px; width:14px; height:14px; border-radius:50%;
    background:#F7F5FB; border:2px solid rgba(21,19,31,.2);
  }
  .look-collage{
    flex:none; width:78px; height:78px; border-radius:16px; overflow:hidden;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px;
  }
  .look-collage .slot{display:flex;align-items:center;justify-content:center;}
  .look-collage .slot svg{width:22px;height:22px;}
  .look-collage .slot img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .look-info{flex:1;min-width:0;}
  .look-info .name{font-family:'Space Grotesk'; font-weight:700; font-size:16.5px; color:var(--ink); margin:0 0 4px;}
  .look-info .meta{font-family:'Space Mono'; font-size:10px; color:var(--ink-soft); letter-spacing:.03em; text-transform:uppercase;}
  .chev{margin-left:auto; opacity:.4; flex:none;}

  .tabbar{
    position:absolute; left:16px; right:16px; bottom:20px; height:68px; z-index:30;
    border-radius:24px; background:rgba(21,19,31,.88); backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:space-around; padding:0 6px;
    box-shadow:0 18px 30px rgba(0,0,0,.35);
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:none; border:none; cursor:pointer; width:74px; height:52px; border-radius:16px;
    color:rgba(255,255,255,.5); font-family:'Space Mono'; font-size:9px;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .tab svg{width:20px;height:20px;}
  .tab.active{
    color:#fff; background:linear-gradient(120deg,var(--violet),var(--pink));
  }

  .overlay{
    position:absolute; inset:0; background:rgba(15,12,22,.5); opacity:0; pointer-events:none;
    transition:opacity .25s var(--ease); z-index:60;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:70;
    background:#F7F5FB; border-radius:28px 28px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.3);
    transform:translateY(105%); transition:transform .32s var(--ease);
    max-height:90%; display:flex; flex-direction:column;
  }
  .sheet.show{transform:translateY(0);}
  .sheet .grabber{width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px;}
  .sheet-inner{padding:12px 20px 30px; overflow-y:auto;}
  .sheet h3{
    font-family:'Space Grotesk'; font-size:21px; font-weight:700; margin:6px 0 16px; color:var(--ink);
  }
  .field-label{
    font-family:'Space Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--ink-soft); margin:14px 0 7px;
  }
  .text-input{
    width:100%; border:1px solid var(--line); background:#fff; border-radius:14px;
    padding:13px 15px; font-family:'Inter'; font-size:15px; color:var(--ink); outline:none;
  }
  .text-input:focus{outline:2px solid var(--violet); outline-offset:1px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:'Space Mono'; font-size:11.5px; letter-spacing:.03em; padding:9px 14px;
    border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .upload-box{
    margin-top:6px; border:1.5px dashed rgba(21,19,31,.2); border-radius:16px; padding:20px;
    display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer; background:#fff;
    position:relative;
  }
  .upload-box img{width:64px;height:64px;object-fit:cover;border-radius:12px;}
  .upload-box .hint{font-size:12px;color:var(--ink-soft);}
  .upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .pick-groups{display:flex; flex-direction:column; gap:16px; margin-top:6px;}
  .pick-group-title{font-family:'Space Mono'; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  .pick-strip{display:flex; gap:9px; overflow-x:auto; margin-top:8px;}
  .pick-item{
    flex:none; width:68px; height:82px; border-radius:16px; background:#fff;
    border:1.5px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; cursor:pointer;
  }
  .pick-item .icon-circle{width:34px;height:34px;}
  .pick-item .icon-circle svg{width:18px;height:18px;}
  .pick-item.selected{border-color:var(--violet); background:var(--violet-soft);}
  .pick-item .n{font-size:8.5px;color:var(--ink-soft);text-align:center;padding:0 3px;}

  .primary-btn{
    width:100%; margin-top:22px; border:none; border-radius:16px; padding:15px;
    background:linear-gradient(120deg,var(--violet),var(--pink)); color:#fff;
    font-family:'Space Grotesk'; font-weight:700; font-size:14.5px; cursor:pointer;
    box-shadow:0 14px 24px rgba(108,76,255,.32);
  }
  .primary-btn:active{transform:scale(.98);}
  .secondary-btn{
    width:100%; margin-top:9px; border:1px solid var(--line); border-radius:16px; padding:13px;
    background:transparent; color:var(--ink-soft); font-family:'Inter'; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .danger-btn{
    width:100%; margin-top:9px; border:1px solid rgba(255,75,92,.3); border-radius:16px; padding:13px;
    background:rgba(255,75,92,.08); color:var(--danger); font-family:'Inter'; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  
  /* НОВЫЙ ДИЗАЙН ПАПКИ ЛУКА (ВЕРТИКАЛЬНЫЙ СПИСОК) */
  .look-detail-list { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; margin-bottom: 24px; }
  .cat-section { display: flex; flex-direction: column; gap: 8px; }
  .cat-lbl { font-family: 'Space Mono'; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; padding-left: 4px; }
  .look-detail-row {
    display: flex; align-items: center; gap: 14px;
    padding: 10px; border-radius: 20px; background: #fff;
    border: 1px solid var(--line);
  }
  .look-detail-row.empty { border: 1.5px dashed rgba(21,19,31,.15); background: transparent; }
  .look-detail-row .pic {
    width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .look-detail-row .pic img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .look-detail-row .pic svg { width: 28px; height: 28px; }
  .look-detail-row .info { flex: 1; min-width: 0; }
  .look-detail-row .info b { display: block; font-family: 'Space Grotesk'; font-size: 16px; color: var(--ink); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .look-detail-row .info span { font-family: 'Space Mono'; font-size: 10px; color: var(--ink-faint); }

  .profile-view{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:26px;}
  .profile-view .avatar{
    width:80px;height:80px;border-radius:26px; background:linear-gradient(135deg,var(--violet),var(--pink));
    display:flex; align-items:center;justify-content:center; margin-bottom:16px;
  }
  .profile-view h2{font-family:'Space Grotesk'; font-size:21px; margin:0 0 6px; font-weight:700;}
  .profile-view p{font-size:12.5px;color:var(--ink-soft);max-width:250px;margin:0;}
  .profile-stats{display:flex;gap:14px;margin-top:24px; width:100%;}
  .profile-stats .glass-card{flex:1; padding:16px 8px; text-align:center;}
  .profile-stats b{display:block;font-family:'Space Grotesk';font-size:22px;}
  .profile-stats span{font-family:'Space Mono';font-size:9px;color:var(--ink-soft);text-transform:uppercase;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="mesh"></div>

  <div class="app">

    <!-- HOME -->
    <div class="screen active" id="screenHome">
      <p class="eyebrow" id="dateLine">Вторник, 25 августа</p>
      <h1 class="title" id="greeting">Доброе <span class="grad-word">утро</span></h1>
      <div class="stat-row">
        <span id="itemCount">0 вещей</span><span class="dot"></span><span id="lookCount">0 луков</span>
      </div>

      <button class="cta-add" id="homeAddBtn">
        <span class="plus-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        </span>
        <span class="txt"><b>Добавить вещь</b><span>Новое фото в гардероб</span></span>
      </button>

      <div class="bento">
        <div class="bento-card glass-card" data-goto="items">
          <span class="icon-badge" style="background:var(--violet-soft);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 3h1.4c.6 2 2 2 3.2 0H15l1 5-2.2 1.2c.4 2.6-.2 4.4-1.8 5.8-1.6-1.4-2.2-3.2-1.8-5.8L8 8l1-5z" stroke="var(--violet)" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 3L6 9M15 3l3 6" stroke="var(--violet)" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <div>
            <b>Все вещи</b><br><span id="bentoItemsCount">0 предметов</span>
          </div>
        </div>
        <div class="bento-card glass-card" data-goto="looks">
          <span class="icon-badge" style="background:var(--pink-soft);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 5.6L20 10l-4.5 3.6L16.8 20 12 16.6 7.2 20l1.3-6.4L4 10l5.8-1.4L12 3z" stroke="var(--pink)" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </span>
          <div>
            <b>Мои луки</b><br><span id="bentoLooksCount">0 образов</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Недавно добавлено</h2>
          <button class="link-btn" data-goto="items">все вещи →</button>
        </div>
        <div class="strip" id="recentStrip"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Твои луки</h2>
          <button class="link-btn" data-goto="looks">смотреть все →</button>
        </div>
        <div id="recentLooks"></div>
      </div>
    </div>

    <!-- ITEMS -->
    <div class="screen" id="screenItems">
      <div class="page-head">
        <div>
          <p class="eyebrow">Гардероб</p>
          <h1 class="title" style="font-size:26px;">Все вещи</h1>
        </div>
        <button class="pill-btn" id="itemsAddBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
          Добавить
        </button>
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" data-filter="all">Все</button>
        <button class="filter-chip" data-filter="headwear">Головной убор</button>
        <button class="filter-chip" data-filter="tops">Верх</button>
        <button class="filter-chip" data-filter="bottoms">Низ</button>
        <button class="filter-chip" data-filter="shoes">Обувь</button>
      </div>
      <div class="items-grid" id="itemsGrid"></div>
    </div>

    <!-- LOOKS -->
    <div class="screen" id="screenLooks">
      <div class="page-head">
        <div>
          <p class="eyebrow">Образы</p>
          <h1 class="title" style="font-size:26px;">Твои луки</h1>
        </div>
        <button class="pill-btn" id="looksAddBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
          Папка
        </button>
      </div>
      <button class="link-btn" id="rollBtnLooks" style="margin-top:10px;">🎲 собрать случайный лук</button>
      <div class="looks-grid" id="looksGrid"></div>
    </div>

    <!-- PROFILE -->
    <div class="screen" id="screenProfile">
      <div class="profile-view">
        <div class="avatar">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#fff" stroke-width="1.6"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h2>Твой профиль</h2>
        <p>Статистика гардероба и любимые сочетания собираются здесь автоматически.</p>
        <div class="profile-stats">
          <div class="glass-card"><b id="pStat1">0</b><span>Вещей</span></div>
          <div class="glass-card"><b id="pStat2">0</b><span>Луков</span></div>
          <div class="glass-card"><b>4</b><span>Категории</span></div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Главная
      </button>
      <button class="tab" data-tab="items">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 3h1.4c.6 2 2 2 3.2 0H15l1 5-2.2 1.2c.4 2.6-.2 4.4-1.8 5.8-1.6-1.4-2.2-3.2-1.8-5.8L8 8l1-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 3L6 9M15 3l3 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Вещи
      </button>
      <button class="tab" data-tab="looks">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 5.6L20 10l-4.5 3.6L16.8 20 12 16.6 7.2 20l1.3-6.4L4 10l5.8-1.4L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Луки
      </button>
      <button class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.3-3.6 3.9-5.4 7-5.4S17.7 16.4 19 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Профиль
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div class="sheet-inner" id="sheetInner"></div>
  </div>
</div>

<script>
(function(){
  const CATS = {
    headwear: {label:'1. Головной убор', short:'Убор', color:'violet', soft:'var(--violet-soft)', main:'var(--violet)'},
    tops:     {label:'2. Верх',          short:'Верх', color:'pink',   soft:'var(--pink-soft)',   main:'var(--pink)'},
    bottoms:  {label:'3. Низ',           short:'Низ',  color:'teal',   soft:'var(--teal-soft)',   main:'var(--teal)'},
    shoes:    {label:'4. Обувь',         short:'Обувь',color:'amber',  soft:'var(--amber-soft)',  main:'var(--amber)'}
  };

  function shapePath(cat){
    const shapes = {
      headwear: `<path d="M15 58c0-20 16-34 35-34s35 14 35 34" fill="none" stroke="M" stroke-width="7" stroke-linecap="round"/><path d="M15 58h70v6c0 3-2 5-5 5H20c-3 0-5-2-5-5v-6z" fill="M" /><path d="M85 58l14-3c3-1 5 1 5 4s-2 5-5 5l-14 1" fill="M"/>`,
      tops: `<path d="M35 18l15-6 15 6 18 12-9 12-9-5v49H30V37l-9 5-9-12z" fill="M"/>`,
      bottoms: `<path d="M32 15h36l3 70h-15l-4-40-4 40H33z" fill="M"/>`,
      shoes: `<path d="M12 62c0-10 8-16 18-18l30-6c8-2 14 2 20 8l14 8c4 2 6 5 6 8 0 3-2 5-6 5H16c-3 0-4-2-4-5z" fill="M"/>`
    };
    return shapes[cat];
  }
  function icon(cat){
    return `<svg viewBox="0 0 100 100">${shapePath(cat).split('M').join(CATS[cat].main==='var(--violet)'?'#6C4CFF':CATS[cat].main==='var(--pink)'?'#FF5D8F':CATS[cat].main==='var(--teal)'?'#0FBF9F':'#FFA43D')}</svg>`;
  }

  function seed(){
    return {
      wardrobe: { headwear:[], tops:[], bottoms:[], shoes:[] },
      looks: []
    };
  }

  let state = seed();
  let tempPhoto = null;
  // Теперь здесь хранятся МАССИВЫ выбранных вещей для каждой категории
  let lookSelection = {headwear:[], tops:[], bottoms:[], shoes:[]};
  let currentFilter = 'all';

  function save(){
    try { 
      // V5 — версия с массивами во всех категориях
      localStorage.setItem('wardrobe-state-v5', JSON.stringify(state)); 
    } catch(e) {
      console.error('Ошибка сохранения:', e);
      if (e.name === 'QuotaExceededError') {
        alert('Память браузера переполнена! Удали лишние фото или используй скриншоты поменьше.');
      }
    }
  }

  function load(){
    try {
      const saved = localStorage.getItem('wardrobe-state-v5');
      if(saved) { 
        state = JSON.parse(saved); 
      }
    } catch(e) {}
    renderAll();
  }

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function allItemsFlat(){
    const out = [];
    Object.keys(state.wardrobe).forEach(cat=> state.wardrobe[cat].forEach(it=> out.push({...it, cat})));
    return out;
  }
  function findItem(cat,id){ return state.wardrobe[cat].find(i=>i.id===id); }
  function wordVeshi(n){ const m=n%10, m2=n%100; if(m2>=11&&m2<=14) return 'вещей'; if(m===1) return 'вещь'; if(m>=2&&m<=4) return 'вещи'; return 'вещей'; }
  function wordLuki(n){ const m=n%10, m2=n%100; if(m2>=11&&m2<=14) return 'луков'; if(m===1) return 'лук'; if(m>=2&&m<=4) return 'лука'; return 'луков'; }

  function renderHeader(){
    const h = new Date().getHours();
    const g = h<6 ? 'ночи' : h<12 ? 'утро' : h<18 ? 'день' : 'вечер';
    document.getElementById('greeting').innerHTML = g==='ночи'
      ? `Доброй <span class="grad-word">ночи</span>`
      : `${g==='утро'?'Доброе':'Добрый'} <span class="grad-word">${g}</span>`;
    const d = new Date();
    const days=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    document.getElementById('dateLine').textContent = `${days[d.getDay()][0].toUpperCase()+days[d.getDay()].slice(1)}, ${d.getDate()} ${months[d.getMonth()]}`;
    
    const total = allItemsFlat().length;
    document.getElementById('itemCount').textContent = `${total} ${wordVeshi(total)}`;
    document.getElementById('lookCount').textContent = `${state.looks.length} ${wordLuki(state.looks.length)}`;
    document.getElementById('bentoItemsCount').textContent = `${total} предметов`;
    document.getElementById('bentoLooksCount').textContent = `${state.looks.length} образов`;
    document.getElementById('pStat1').textContent = total;
    document.getElementById('pStat2').textContent = state.looks.length;
  }

  function itemCardHTML(cat,item){
    const visual = item.image ? `<img src="${item.image}">` : icon(cat);
    return `<div class="item-card" data-cat="${cat}" data-id="${item.id}">
      <span class="del" data-del="${cat}:${item.id}">×</span>
      <div class="icon-circle" style="background:${CATS[cat].soft};">${visual}</div>
      <span class="name">${item.name}</span>
    </div>`;
  }

  function renderRecentStrip(){
    const flat = allItemsFlat();
    const recent = flat.slice(-8).reverse();
    const el = document.getElementById('recentStrip');
    if(recent.length===0){ el.innerHTML = `<div class="empty-hint" style="width:100%;">Добавь первую вещь — она появится здесь</div>`; return; }
    el.innerHTML = recent.map(it=>itemCardHTML(it.cat,it)).join('');
  }

  function renderItemsGrid(){
    const grid = document.getElementById('itemsGrid');
    let flat = allItemsFlat();
    if(currentFilter!=='all'){ flat = flat.filter(i=>i.cat===currentFilter); }
    if(flat.length===0){ grid.innerHTML = `<div class="empty-hint" style="grid-column:1/-1;">В этой категории пока пусто</div>`; return; }
    grid.innerHTML = flat.map(it=>itemCardHTML(it.cat,it)).join('');
  }

  function collageSlotHTML(cat, id){
    if(!cat || !id) return `<div class="slot" style="background:rgba(21,19,31,.04);"></div>`;
    const it = findItem(cat,id);
    if(!it) return `<div class="slot" style="background:rgba(21,19,31,.04);"></div>`;
    return `<div class="slot" style="background:${CATS[cat].soft};">${it.image ? `<img src="${it.image}" style="object-fit:contain;padding:4px;">` : icon(cat)}</div>`;
  }

  function lookCardHTML(look){
    const allSelected = [];
    ['headwear','tops','bottoms','shoes'].forEach(c => {
      if(look.items[c]) look.items[c].forEach(id => allSelected.push({cat:c, id}));
    });
    
    // В превью карточки показываем первые 4 вещи
    const slots = [];
    for(let i=0; i<4; i++) {
      if(i < allSelected.length) slots.push(collageSlotHTML(allSelected[i].cat, allSelected[i].id));
      else slots.push(collageSlotHTML(null, null));
    }
    
    return `<div class="look-card glass-card" data-look="${look.id}">
      <div class="look-collage">${slots.join('')}</div>
      <div class="look-info">
        <p class="name">${look.name}</p>
        <p class="meta">${allSelected.length} вещей · ${look.dateLabel}</p>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  }

  function renderLooksGrid(targetId, limit){
    const el = document.getElementById(targetId);
    let list = state.looks.slice().reverse();
    if(limit) list = list.slice(0,limit);
    if(list.length===0){
      el.innerHTML = `<div class="empty-hint">Пока нет ни одного лука. Нажми «Папка», чтобы собрать первый образ.</div>`;
      return;
    }
    el.innerHTML = list.map(lookCardHTML).join('');
  }

  function renderAll(){
    renderHeader();
    renderRecentStrip();
    renderItemsGrid();
    renderLooksGrid('looksGrid', null);
    renderLooksGrid('recentLooks', 2);
  }

  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const sheetInner = document.getElementById('sheetInner');
  function openSheet(html){ sheetInner.innerHTML = html; overlay.classList.add('show'); sheet.classList.add('show'); }
  function closeSheet(){ overlay.classList.remove('show'); sheet.classList.remove('show'); tempPhoto=null; }
  overlay.addEventListener('click', closeSheet);

  function addItemSheetHTML(defaultCat){
    const chips = Object.keys(CATS).map(c=>`<button class="chip ${c===defaultCat?'active':''}" data-catchip="${c}">${CATS[c].label.replace(/\d\.\s/,'')}</button>`).join('');
    return `
      <h3>Новая вещь</h3>
      <div class="field-label">Категория</div>
      <div class="chip-row" id="catChips">${chips}</div>
      <div class="field-label">Фото</div>
      <label class="upload-box" id="uploadBox">
        <span id="uploadPreview">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 17l4.5-5.5a2 2 0 0 1 3 0L16 17M14 12l1.5-1.8a2 2 0 0 1 3 0L21 13" stroke="#A79E8C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="2" stroke="#A79E8C" stroke-width="1.5"/></svg>
        </span>
        <span class="hint">Загрузить фото вещи (необязательно)</span>
        <input type="file" accept="image/*" id="photoInput">
      </label>
      <div class="field-label">Название</div>
      <input class="text-input" id="itemNameInput" placeholder="Например, «Бомбер оверсайз»">
      <button class="primary-btn" id="saveItemBtn">Добавить в гардероб</button>
    `;
  }
  
  function openAddItem(defaultCat){
    openSheet(addItemSheetHTML(defaultCat));
    let currentCat = defaultCat;
    document.getElementById('catChips').addEventListener('click', e=>{
      const b = e.target.closest('[data-catchip]'); if(!b) return;
      currentCat = b.dataset.catchip;
      document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.remove('active'));
      b.classList.add('active');
    });
    document.getElementById('photoInput').addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{ tempPhoto = reader.result; document.getElementById('uploadPreview').innerHTML = `<img src="${tempPhoto}">`; };
      reader.readAsDataURL(f);
    });
    document.getElementById('saveItemBtn').addEventListener('click', ()=>{
      const name = document.getElementById('itemNameInput').value.trim() || 'Новая вещь';
      state.wardrobe[currentCat].push({id:uid(), name, image:tempPhoto});
      save(); renderAll(); closeSheet();
    });
  }

  function pickGroupHTML(cat){
    const items = state.wardrobe[cat];
    if(items.length===0) return '';
    const isTop = cat === 'tops';
    const hint = isTop ? ' <span style="text-transform:none;opacity:.6;font-size:9px;">(можно несколько)</span>' : '';
    return `<div class="pick-group">
      <div class="pick-group-title">${CATS[cat].label.replace(/\d\.\s/,'')}${hint}</div>
      <div class="pick-strip" data-pickcat="${cat}">
        ${items.map(it=>`<div class="pick-item ${lookSelection[cat].includes(it.id)?'selected':''}" data-pickid="${it.id}">
          <div class="icon-circle" style="background:${CATS[cat].soft};">${it.image ? `<img src="${it.image}">` : icon(cat)}</div>
          <span class="n">${it.name}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  function lookSheetHTML(prefillName){
    const hasAny = allItemsFlat().length>0;
    if(!hasAny){
      return `<h3>Новая папка лука</h3><div class="empty-hint">Сначала добавь хотя бы одну вещь в гардероб — потом собери из них лук.</div>`;
    }
    return `
      <h3>Новая папка лука</h3>
      <div class="field-label">Название</div>
      <input class="text-input" id="lookNameInput" value="${prefillName||''}" placeholder="Например, «Прогулка в парке»">
      <div class="field-label" style="margin-top:18px;">Выбери вещи из уже загруженных</div>
      <div class="pick-groups">${Object.keys(CATS).map(pickGroupHTML).join('')}</div>
      <button class="primary-btn" id="saveLookBtn">Сохранить в «Мои луки»</button>
      <button class="secondary-btn" id="shuffleBtn">Перемешать случайно</button>
    `;
  }
  function randomName(){
    const a=['Городской','Лёгкий','Дождливый','Утренний','Вечерний','Смелый','Спокойный','Уютный'];
    const b=['выход','маршрут','вайб','стиль','образ','настрой'];
    return `${a[Math.floor(Math.random()*a.length)]} ${b[Math.floor(Math.random()*b.length)]}`;
  }
  function rollRandom(){
    Object.keys(CATS).forEach(cat=>{
      const items = state.wardrobe[cat];
      if (items.length) {
        lookSelection[cat] = [items[Math.floor(Math.random()*items.length)].id];
      } else {
        lookSelection[cat] = [];
      }
    });
  }

  function openLookSheet(random){
    if(random){ rollRandom(); } else { lookSelection = {headwear:[],tops:[],bottoms:[],shoes:[]}; }
    openSheet(lookSheetHTML(random ? randomName() : ''));
    if(allItemsFlat().length>0) bindLookSheet();
  }

  function bindLookSheet(){
    sheetInner.addEventListener('click', function(e){
      const pick = e.target.closest('[data-pickid]');
      if(pick){
        const cat = pick.closest('[data-pickcat]').dataset.pickcat;
        const id = pick.dataset.pickid;
        const isTop = cat === 'tops';

        if(isTop) {
          // Для верха добавляем или убираем из массива
          if(lookSelection[cat].includes(id)) {
            lookSelection[cat] = lookSelection[cat].filter(i => i !== id);
          } else {
            lookSelection[cat].push(id);
          }
        } else {
          // Для остальных - только 1 вещь
          if(lookSelection[cat].includes(id)) {
            lookSelection[cat] = [];
          } else {
            lookSelection[cat] = [id];
          }
        }
        
        sheetInner.querySelector('.pick-groups').innerHTML = Object.keys(CATS).map(pickGroupHTML).join('');
      }
    });
    document.getElementById('shuffleBtn').addEventListener('click', ()=>{
      rollRandom();
      document.getElementById('lookNameInput').value = randomName();
      sheetInner.querySelector('.pick-groups').innerHTML = Object.keys(CATS).map(pickGroupHTML).join('');
    });
    document.getElementById('saveLookBtn').addEventListener('click', ()=>{
      const name = document.getElementById('lookNameInput').value.trim() || randomName();
      const d = new Date();
      const dateLabel = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
      
      // Глубокое копирование массивов
      const itemsCopy = {
        headwear: [...lookSelection.headwear],
        tops: [...lookSelection.tops],
        bottoms: [...lookSelection.bottoms],
        shoes: [...lookSelection.shoes]
      };

      state.looks.push({id:uid(), name, items:itemsCopy, dateLabel});
      save(); renderAll(); closeSheet();
    });
  }

  // НОВОЕ ОТОБРАЖЕНИЕ ПАПКИ ЛУКА (ВЕРТИКАЛЬНОЕ)
  function lookDetailHTML(look){
    const order = ['headwear','tops','bottoms','shoes'];
    
    const listHTML = order.map(cat => {
      const ids = look.items[cat] || [];
      
      if(ids.length === 0) {
        return `
          <div class="cat-section">
            <div class="cat-lbl">${CATS[cat].label}</div>
            <div class="look-detail-row empty">
              <div class="pic" style="background:rgba(21,19,31,.04);"><span style="font-size:10px;color:var(--ink-faint);">пусто</span></div>
              <div class="info"><b style="color:var(--ink-soft);">Нет вещи</b></div>
            </div>
          </div>`;
      }
      
      return `
        <div class="cat-section">
          <div class="cat-lbl">${CATS[cat].label}</div>
          ${ids.map(id => {
            const it = findItem(cat, id);
            if(!it) return ''; 
            return `
              <div class="look-detail-row">
                <div class="pic" style="background:${CATS[cat].soft};">
                  ${it.image ? `<img src="${it.image}">` : icon(cat)}
                </div>
                <div class="info">
                  <b>${it.name}</b>
                  <span>${CATS[cat].short}</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>`;
    }).join('');

    return `
      <h3>${look.name}</h3>
      <div class="look-detail-list">
        ${listHTML}
      </div>
      <button class="danger-btn" data-deletelook="${look.id}">Удалить лук</button>
    `;
  }

  function openLookDetail(id){
    const look = state.looks.find(l=>l.id===id);
    if(!look) return;
    openSheet(lookDetailHTML(look));
    sheetInner.querySelector('[data-deletelook]').addEventListener('click', ()=>{
      state.looks = state.looks.filter(l=>l.id!==id);
      save(); renderAll(); closeSheet();
    });
  }

  function goto(tab){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen'+tab[0].toUpperCase()+tab.slice(1)).classList.add('active');
    document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  }
  document.querySelectorAll('.tab[data-tab]').forEach(btn=> btn.addEventListener('click', ()=>goto(btn.dataset.tab)));
  document.querySelectorAll('[data-goto]').forEach(el=> el.addEventListener('click', ()=>goto(el.dataset.goto)));

  document.getElementById('homeAddBtn').addEventListener('click', ()=> openAddItem('headwear'));
  document.getElementById('itemsAddBtn').addEventListener('click', ()=> openAddItem(currentFilter==='all'?'headwear':currentFilter));
  document.getElementById('looksAddBtn').addEventListener('click', ()=> openLookSheet(false));
  document.getElementById('rollBtnLooks').addEventListener('click', ()=> openLookSheet(true));

  document.getElementById('filterRow').addEventListener('click', e=>{
    const b = e.target.closest('[data-filter]'); if(!b) return;
    currentFilter = b.dataset.filter;
    document.querySelectorAll('#filterRow .filter-chip').forEach(c=>c.classList.remove('active'));
    b.classList.add('active');
    renderItemsGrid();
  });

  document.body.addEventListener('click', e=>{
    const del = e.target.closest('[data-del]');
    if(del){
      const [cat,id] = del.dataset.del.split(':');
      
      // Удаляем саму вещь
      state.wardrobe[cat] = state.wardrobe[cat].filter(i=>i.id!==id);
      
      // Автоматически очищаем эту вещь из всех луков, где она была
      state.looks.forEach(look => {
        if (look.items[cat]) {
          look.items[cat] = look.items[cat].filter(idInLook => idInLook !== id);
        }
      });

      save(); renderAll();
      return;
    }
    const lookCard = e.target.closest('[data-look]');
    if(lookCard){ openLookDetail(lookCard.dataset.look); return; }
  });

  load();
})();
</script>
</body>
</html>
